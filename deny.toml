# `cargo deny check licenses` (CI): every crate that ends up in Solidbar has to come under one
# of these licenses, so a copyleft dependency can't slip in unnoticed. `accepted` in about.toml,
# which writes THIRD_PARTY_LICENSES.html, lists the same licenses.

[graph]
# The app (Apple silicon and Intel) and its wasm32 interface. Dev-dependencies don't ship.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "wasm32-unknown-unknown"]
exclude-dev = true

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

[licenses.private]
# Solidbar's own crates (publish = false); their license is in LICENSE-MIT and LICENSE-APACHE.
ignore = true
