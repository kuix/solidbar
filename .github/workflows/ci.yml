name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins the toolchain, components and targets.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (native)
        run: cargo clippy --workspace --exclude solidbar-ui --all-targets -- -D warnings
      - name: Clippy (UI, wasm32)
        run: cargo clippy -p solidbar-ui --target wasm32-unknown-unknown -- -D warnings
      - name: Test
        run: cargo test --workspace

  licenses:
    # Reads Cargo.lock and the crates' license files only, so Linux will do.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      # Nothing is built here: the cache keeps cargo-deny and cargo-about, so they aren't
      # fetched from GitHub every time, and the crates whose licenses cargo-about reads.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - uses: cargo-bins/cargo-binstall@v1.23.0
      - run: cargo binstall -y --locked cargo-deny@0.20.2 cargo-about@0.9.2
      - name: Only the licenses deny.toml allows
        run: cargo deny --locked check licenses
      - name: THIRD_PARTY_LICENSES.html is up to date
        run: |
          cargo about generate --workspace --locked --fail about.hbs -o THIRD_PARTY_LICENSES.html
          if ! git diff --quiet -- THIRD_PARTY_LICENSES.html; then
            echo "::error file=THIRD_PARTY_LICENSES.html::Out of date. Run: cargo about generate --workspace --locked --fail about.hbs -o THIRD_PARTY_LICENSES.html"
            git diff --stat -- THIRD_PARTY_LICENSES.html
            exit 1
          fi

  e2e:
    runs-on: macos-15
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@v1.23.0
      - run: cargo binstall -y --locked trunk@0.21.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npx playwright install webkit
      - name: UI flows and accessibility (axe, WCAG 2.2 AA)
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: e2e/test-results
