[workspace]
resolver = "3"
members = ["crates/shared", "crates/core", "crates/ui", "src-tauri"]
# The UI crate only makes sense for wasm32; build it through trunk.
default-members = ["crates/shared", "crates/core", "src-tauri"]

[workspace.package]
version = "0.5.2"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
solidbar-shared = { path = "crates/shared" }
solidbar-core = { path = "crates/core" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
jiff = { version = "0.2.38", default-features = false, features = ["std", "serde"] }

# Disk space matters on this machine: keep line tables for our code, nothing for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
strip = true

[profile.release.package.solidbar-ui]
opt-level = "z"
