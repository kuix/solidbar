[package]
name = "solidbar"
description = "Solidbar — a menu bar client for solidtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "~2.7.1", features = [] }

[dependencies]
solidbar-shared.workspace = true
solidbar-core.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff = { workspace = true, features = ["tz-system", "tzdb-zoneinfo"] }
tauri = { version = "~2.12.2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-nspanel = "=2.1.1"
tauri-plugin-global-shortcut = "~2.4.0"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSFont", "NSFontDescriptor", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSResponder", "NSRunningApplication", "NSWorkspace"] }
tauri-plugin-deep-link = "~2.6.1"
tauri-plugin-opener = "~2.7.0"
auto-launch = "~0.6.0"
tauri-plugin-log = "~2.10.0"
tauri-plugin-updater = { version = "~2.13.0", default-features = false, features = ["native-tls"] }
tokio = { version = "1.53.2", features = ["time"] }
log = "0.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDateFormatter", "NSFormatter", "NSLocale", "NSString"] }
