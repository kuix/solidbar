[package]
name = "solidbar-core"
description = "solidtime API client, auth, time model and sync engine for Solidbar (no Tauri dependency)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
solidbar-shared.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
jiff = { workspace = true, features = ["tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "http2", "json", "query", "form", "charset", "system-proxy"] }
tokio = { version = "1.53.2", features = ["rt", "macros", "net", "sync", "time", "io-util", "io-std"] }
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
url = { version = "2.5.8", features = ["serde"] }
sha2 = "0.11.0"
base64 = "0.23.1"
getrandom = "0.4.3"
log = "0.4"
keyring-core = "1.0.0"
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "test-util"] }
wiremock = "0.6.5"
